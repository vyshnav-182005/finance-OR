# Finance-OR parameters. Any change here = a new experiment (CLAUDE.md §27).

paths:
  scrip_dir: data/SCRIP
  nifty50: data/INDEX/NIFTY 50.csv
  symbols: data/NSE Symbols.CSV
  processed_dir: data/processed
  features_dir: results/features

preprocessing:
  # Bad-print excursions: price jumps >25% away and an opposite >25% jump brings it back to
  # within 5% of the pre-jump close within <= spike_max_len rows. The excursion rows are dropped.
  spike_min_move: 0.25
  spike_return_tol: 0.05
  spike_max_len: 5
  # Corporate actions (split/bonus/consolidation) are NOT adjusted in the raw data.
  # A close ratio <= ca_max_ratio (or >= 1.8 for >=2:1 consolidations) across <= ca_max_gap
  # NIFTY days that matches a standard factor within ca_tol is treated as a corporate action
  # and the return on that day is neutralised (raw_ratio * factor - 1).
  ca_max_ratio: 0.70
  ca_max_gap: 5
  ca_tol: 0.08
  ca_factors: [1.5, 2, 2.5, 3, 4, 5, 6, 10, 20]

windows:
  train_years: 4
  first_test_year: 2000   # stock data starts 1996-01-01 -> first train window 1996-1999
  last_test_year: 2021    # 2021 data ends 2021-07-01 (partial test year)

universe:
  min_obs_frac: 0.80      # valid obs on >= 80% of NIFTY trading days in the training window
  last_obs_within_days: 21  # must still trade in the last ~1 month of the window (formation date)
  # Penny-stock exclusion (INR, last training-window close). Sub-5 prices move in tick-size
  # jumps (0.30 -> 0.45 = +50%) that distort returns/volatility and the CA heuristic.
  min_price: 5

features:
  trading_days: 252
  # Assumption: constant annual risk-free rate ~ long-run average Indian 91-day T-bill
  # yield over 1996-2020 (ranged roughly 3-12%). No T-bill series is in the dataset.
  risk_free_rate: 0.07

clustering:
  k_candidates: [3, 4, 5, 6, 7, 8]   # diagnostics recorded for all
  # K is chosen per window by max silhouette among candidates that keep the IP feasible:
  # K >= min_clusters and sum_k min(|cluster k|, max_per_cluster) >= n_stocks.
  # (K = 3 or 4 can never satisfy "15 stocks, <= 3 per cluster, >= 5 clusters".)
  n_init: 20
  seed: 42

selection:
  n_stocks: 15
  max_per_cluster: 3
  min_clusters: 5
  # Score_i = sum_f w_f * sign_f * Z_f ; sign = -1 for Volatility and MaxDrawdown.
  # Fixed a priori (never tuned on test years). Alternatives are robustness experiments.
  score_weights:
    Sharpe: 0.30
    Return: 0.20
    Liquidity: 0.10
    Volatility: 0.20
    MaxDrawdown: 0.20

goal_programming:
  # Goal targets from the project proposal (slide 7). Weighted (non-pre-emptive) GP:
  # minimise sum_k priority_k * d_k / |target_k| over the unwanted deviations d_k >= 0.
  targets: {Return: 0.20, Volatility: 0.20, Sharpe: 0.90, Beta: 1.00}
  priorities: {Return: 1, Volatility: 1, Sharpe: 1, Beta: 1}
  # Concentration limits: at most 15% (~2.25x equal weight), every selected stock >= 2%.
  min_weight: 0.02
  max_weight: 0.15

backtest:
  # One-way cost per unit of turnover (sum |w_new - w_drifted|). 0.25% ~ brokerage + STT
  # + stamp duty + exchange fees + modest impact for Indian delivery trades.
  cost_rate: 0.0025
  cost_rates_sensitivity: [0.0, 0.001, 0.0025, 0.005, 0.01]
  random_draws: 100
  random_seed: 7
